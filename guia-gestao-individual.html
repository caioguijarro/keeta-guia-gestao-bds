<style>
  :root {
    --bg: #F5F4F0;
    --card: #FFFFFF;
    --border: #E6E3DC;
    --border2: #EDE9E1;
    --text: #2C2B28;
    --sub: #8C8880;
    --muted: #B8B4AC;
    --line: #D9D5CC;
    --green: #4A7C59;
    --greenBg: #EDF3EF;
    --greenLight: #C6DDD0;
    --red: #B05555;
    --redBg: #F5ECEC;
    --amber: #B8813A;
    --amberBg: #F5EFE4;
    --blue: #4A6899;
    --blueBg: #EBF0F8;
  }
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: 'DM Sans', 'Segoe UI', -apple-system, sans-serif;
    padding: 28px 32px;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: #F5F4F0; }
  ::-webkit-scrollbar-thumb { background: #E6E3DC; border-radius: 2px; }

  .header { margin-bottom: 24px; }
  .header-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .logo {
    width: 24px; height: 24px; border-radius: 6px; background: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; color: #fff;
  }
  .kicker {
    font-size: 10px; font-weight: 700; color: var(--sub);
    text-transform: uppercase; letter-spacing: 0.14em;
  }
  h1.title {
    font-size: 26px; font-weight: 800; color: var(--text);
    letter-spacing: -0.03em;
    font-family: 'Playfair Display', Georgia, serif;
    line-height: 1.1;
  }
  .subtitle { font-size: 11px; color: var(--sub); margin-top: 4px; }

  .tag {
    font-size: 9px; font-weight: 700;
    border-radius: 4px; padding: 3px 8px;
    text-transform: uppercase; letter-spacing: 0.06em;
    white-space: nowrap; display: inline-block;
  }

  .tabbar {
    display: flex; gap: 2px; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tabbar button {
    background: none; border: none; padding: 10px 20px; cursor: pointer;
    font-size: 12px; font-weight: 700;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all .15s;
    font-family: inherit;
  }
  .tabbar button.active {
    color: var(--text);
    border-bottom: 2px solid var(--text);
  }
  .tab-group-label {
    font-size: 9px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 14px;
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .profile-header { border-top: 3px solid var(--accent); }
  .profile-row {
    display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;
    gap: 12px; flex-wrap: wrap;
  }
  h2.name {
    font-size: 22px; font-weight: 800; color: var(--text);
    font-family: 'Playfair Display', Georgia, serif; letter-spacing: -0.03em;
  }
  .role-line { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

  .summary-text { font-size: 12px; color: var(--text); line-height: 1.7; margin-bottom: 12px; }
  .section-title {
    font-size: 9px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }

  .bigfive-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .bigfive-bar .lbl { width: 90px; font-size: 10px; font-weight: 600; color: var(--sub); }
  .bigfive-bar .track { flex: 1; height: 6px; background: var(--border2); border-radius: 99px; overflow: hidden; }
  .bigfive-bar .fill { height: 100%; border-radius: 99px; }
  .bigfive-bar .val {
    width: 28px; font-size: 10px; font-weight: 700; color: var(--text);
    font-family: 'DM Mono', monospace; text-align: right;
  }

  .callout { border-radius: 8px; padding: 10px 14px; }
  .callout .ct-label {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }
  .callout .ct-text { font-size: 11px; color: var(--text); line-height: 1.5; }
  .super { background: var(--greenBg); border: 1px solid var(--greenLight); }
  .super .ct-label { color: var(--green); }
  .blind { background: var(--redBg); border: 1px solid var(--border2); }
  .blind .ct-label { color: var(--red); }

  .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .section-head {
    font-size: 10px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-desc { font-size: 11px; color: var(--sub); margin-bottom: 12px; }

  .insight {
    border-radius: 8px; padding: 10px 14px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .insight .i-text { font-size: 12px; color: var(--text); line-height: 1.6; flex: 1; }
  .insight.funciona { background: var(--greenBg); border: 1px solid var(--greenLight); }
  .insight.cuidado { background: var(--amberBg); border: 1px solid var(--border2); }
  .insight.acao { background: var(--blueBg); border: 1px solid var(--border2); }
  .insight.risco { background: var(--redBg); border: 1px solid var(--border2); }

  .pending-card { text-align: center; }
  .pending-card .icon { font-size: 32px; margin-bottom: 12px; }
  .pending-card .t { font-size: 16px; font-weight: 700; color: var(--red); margin-bottom: 8px; }
  .pending-card .d {
    font-size: 12px; color: var(--sub); line-height: 1.6;
    max-width: 460px; margin: 0 auto;
  }
  .pending-tags { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  details.history {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 16px;
  }
  details.history summary {
    cursor: pointer; font-size: 12px; font-weight: 700; color: var(--sub);
    list-style: none;
  }
  details.history summary::before { content: "▸ "; color: var(--muted); }
  details.history[open] summary::before { content: "▾ "; }
  details.history .hist-inner { margin-top: 16px; }

  .footer {
    margin-top: 36px; padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); flex-wrap: wrap; gap: 8px;
  }
.tactic-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .tactic-card h4 {
    font-size: 13px; font-weight: 800; color: var(--text);
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .tactic-number {
    width: 22px; height: 22px; border-radius: 99px;
    background: var(--text); color: #fff;
    font-size: 10px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tactic-meta { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tactic-body { font-size: 12px; color: var(--text); line-height: 1.7; }
  .tactic-body strong { color: var(--text); }
  .example-box {
    background: var(--blueBg); border: 1px solid var(--border2); border-radius: 8px;
    padding: 10px 14px; margin-top: 10px; font-size: 11px; color: var(--text); line-height: 1.6;
  }
  .example-box .label {
    font-size: 9px; font-weight: 700; color: var(--blue);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }
  .example-box em { font-style: normal; color: var(--green); font-weight: 700; }
  .warning-box {
    background: var(--redBg); border: 1px solid var(--border2); border-radius: 8px;
    padding: 10px 14px; margin-top: 10px; font-size: 11px; color: var(--text); line-height: 1.6;
  }
  .warning-box .label {
    font-size: 9px; font-weight: 700; color: var(--red);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }
  .bd-match { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .bd-match .bd-chip {
    font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px;
    background: var(--greenBg); color: var(--green); border: 1px solid var(--greenLight);
  }
  .bd-match .bd-chip.warn {
    background: var(--amberBg); color: var(--amber); border: 1px solid var(--border2);
  }
  .toc {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; margin-bottom: 16px;
  }
  .toc-title {
    font-size: 10px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px;
  }
  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc li { font-size: 11px; color: var(--sub); line-height: 2; }
  .toc li a { color: var(--text); text-decoration: none; font-weight: 600; }
  .toc li a:hover { text-decoration: underline; }
  .toc li span { color: var(--muted); margin-left: 4px; }
  .module-header {
    font-size: 10px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 12px; margin-top: 4px;
  }

  .lang-toggle {
    display: flex; gap: 2px; background: var(--border2); border-radius: 6px;
    padding: 2px; font-size: 11px; font-weight: 700; margin-left: auto;
  }
  .lang-toggle button {
    background: none; border: none; padding: 4px 10px; cursor: pointer;
    border-radius: 4px; color: var(--sub); font-family: inherit; font-size: 11px; font-weight: 700;
  }
  .lang-toggle button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
</style>
</head>

    // Manager profile
    manager_summary: "Caio é ENFJ-A (Protagonista) com DISC Thinker (Pensador, ritmo ponderado) e um Big Five marcante: Amabilidade altíssima (101), Consciência alta (96), Extroversão alta (82), Abertura moderada (74) e Neuroticismo baixo (40). É um líder que une empatia e estrutura — o ENFJ inspira e cuida das pessoas, enquanto a Consciência 96 garante processo, follow-up e previsibilidade. O Neuroticismo 40 o mantém calmo sob pressão. O DISC Thinker adiciona um traço deliberativo: ele planeja antes de agir e valoriza o trabalho em equipe. Ele é o contraponto do próprio time: lidera uma equipe com dois ENTJ-A (Comandante) e um ENFP (Ativista) sendo ele mesmo um Protagonista orientado a pessoas — e é justamente a Amabilidade 101 que mantém esse grupo de perfis fortes funcionando junto.",

    manager_style_4: "Amabilidade 101 pode virar 'chefe bonzinho demais'. O risco de suavizar feedbacks que precisavam ser duros, de tolerar performance mediana para não gerar desconforto, e de cobrar menos do que a meta exige.",

    vini_ldr3: "Desafio intelectual. Ele precisa sentir que está aprendendo e crescendo. Envolva-o em discussões de estratégia da operação, não só em execução de visitas.",
    vini_ldr4: "Não corrija em público. A correção diante dos colegas vira confronto com um ENTJ. Leve o ajuste para o 1:1.",
    vini_ldr5: "Diferente do Victor (Técnico + abertura 110), o Vinicius é mais cauteloso e menos extremo. Não presuma que ele vai ser tão rápido quanto Victor em pivotar ou experimentar.",
    vini_ldr6: "Use-o como ponte entre o time e o cliente. O Finalizador (fidedigno, solidário) + ENTJ (autoridade) = perfil ideal para leads que exigem confiança antes de decisão.",
    vini_risk1: "A abertura 76 é moderada-alta: tolera rotina mas sem novidade completa o engajamento cai. Menos intenso que o Victor, mas ainda presente.",
    vini_risk2: "A consciência 66 é o ponto central. O Finalizador valoriza processo, mas o ENTJ-A quer velocidade. A inconsistência na gestão de follow-up/CRM é o risco principal.",
    vini_risk3: "Check-in rápido 1x por semana (5 min) focado em pipeline e follow-up. Pergunte 'o que está travando o fechamento?' — ele prefere resolver problemas concretos.",
    // Natalia
    nat_summary: "Natalia é ENTJ-A (Comandante Assertivo) com DISC Thinker (Analítico) — uma combinação rara e poderosa. O ENTJ traz liderança natural, visão estratégica e assertividade. O Thinker adiciona meticulosidade, orientação a dados e cuidado com detalhes. No Big Five, a Consciência recorde (116) mostra alguém extremamente organizada, responsável e orientada a processo. O Neuroticismo muito baixo (38) a torna a mais emocionalmente estável do time. Extroversão alta (93) + Afabilidade alta (93) criam uma líder que é ao mesmo tempo assertiva e agradável — ela conduz sem ser rude.",
    nat_superpower: "Consegue liderar com precisão. A combinação de visão estratégica (ENTJ) + meticulosidade (Thinker) + Consciência 116 faz dela alguém que não só define onde ir, mas também garante que cada passo seja dado corretamente. É a BD mais confiável para processos complexos.",
    nat_blindspot: "A abertura moderada (65) combinada com o Thinker pode fazer dela alguém menos flexível a abordagens novas ou improvisações. Ela pode preferir o método testado ao experimento inédito. Em situações que exigem pivotar rápido, ela pode hesitar.",
    nat_com1: "Prospecção estruturada. Ela prepara argumentos com dados e antecipa objeções. O Thinker + Consciência 116 faz dela uma máquina de preparação.",
    nat_com2: "Execução impecável de processo. Checklists, follow-ups, CRM atualizado — ela não deixa passar nada. O dono do restaurante sente que está falando com alguém profissional.",
    nat_com3: "Pode parecer fria ou excessivamente racional. A afabilidade 93 ameniza, mas o ENTJ + Thinker + foco em dados pode soar como 'robô' para donos mais emocionais.",
    nat_com4: "Tendência a querer ter todas as respostas antes de agir. O Thinker + Consciência 116 pode gerar paralisia por análise em semanas de alta velocidade.",
    nat_com5: "Dê a ela tempo de preparação. Se for uma visita complexa, avise com antecedência. O Thinker precisa de tempo para processar e estruturar.",
    nat_com6: "Treine improvisação: role-plays em que o dono muda de assunto inesperadamente. Pratique pivotar do técnico para o emocional e vice-versa.",
    nat_ldr1: "Reconhecimento de execução. Ela precisa sentir que a qualidade do trabalho é notada. Celebre a precisão, não só os resultados.",
    nat_ldr2: "Clareza de prioridades. O ENTJ + Thinker + Consciência 116 quer saber exatamente o que é mais importante agora. Ambiguidade de prioridade gera ansiedade.",
    nat_ldr3: "Autonomia com responsabilidade. Ela quer controle sobre COMO fazer, mas também quer ser responsabilizada pelo resultado. Microgerenciamento é desnecessário — ela já se cobra muito.",
    nat_ldr4: "Evite mudanças de última hora sem explicação. O Thinker + Consciência 116 precisa de tempo para recalibração. Mudanças abruptas são estressantes.",
    nat_ldr5: "Não a force a improvisar. Ela pode fazer, mas não é natural. Dê espaço para preparação mesmo em cenários imprevisíveis.",
    nat_ldr6_timebox: "Estabeleça um 'timebox' para análise: 'você tem 30 min para revisar esse contrato, depois envia'. Isso liberta ela da busca pela perfeição infinita.",
    nat_risk1: "Consciência 116 é um superpoder, mas pode virar obsessão por controle. Se o processo mudar sem aviso, ela pode se frustrar profundamente.",
    nat_risk2: "Abertura 65 + Thinker = resistência natural a experimentos. Em um mercado que muda rápido (como delivery), isso pode atrasar adaptações.",
    nat_risk3: "Check-in semanal curto (10 min) focado em prioridades e bloqueios. Pergunte 'o que precisa de clareza?' — ela valoriza precisão sobre empatia vaga.",
    // Marcelo
    mar_summary: "Marcelo é ENFP (Ativista) com DISC Equilibrado — o perfil mais energético e adaptável do time. O ENFP traz entusiasmo, criatividade e genuína preocupação com as pessoas. O DISC Equilibrado significa que ele não tem um estilo dominante fixo: consegue alternar entre abordagens diretas, persuasivas, analíticas ou de apoio conforme a situação exige. No Big Five, a Extroversão muito alta (104) + Abertura alta (95) + Neuroticismo alto (84) criam alguém intensamente social, criativo e emocionalmente expressivo. É o BD que vai 'sentir' o restaurante antes de vender para ele.",
    mar_superpower: "Adaptabilidade social e criatividade. Consegue ler o ambiente em segundos e ajustar o tom da conversa instantaneamente. O DISC Equilibrado + ENFP faz dele um 'camaleão comercial' — funciona com todo tipo de dono de restaurante.",
    mar_blindspot: "Neuroticismo alto (84) + Consciência moderada (74) = pode oscilar muito de humor e produtividade. Dias bons são excelentes; dias ruins podem ser muito ruins. Sem estrutura externa, a consistência sofre.",
    mar_com1: "Prospecção calorosa e genuína. O ENFP + Equilibrado cria conexão rápida. Donos de restaurante sentem que ele se importa de verdade — porque se importa.",
    mar_com2: "Criatividade nas abordagens. Consegue criar pitches personalizados na hora, adaptando-se ao estilo do dono. Não usa script fixo.",
    mar_com3: "Tendência a falar demais. Extroversão 104 + ENFP = pode se perder em conversa e esquecer o objetivo comercial da visita. Precisa de um 'north star' claro.",
    mar_com4: "Sob rejeição, pode levar para o lado pessoal. Neuroticismo 84 = a frustração do 'não' afeta o humor e a performance do dia seguinte.",
    mar_com5: "Dê a ele liberdade criativa, mas com estrutura leve. Um checklist simples de 3 pontos por visita mantém o foco sem sufocar a espontaneidade.",
    mar_com6: "Crie um ritual diário de 10 min para atualização de CRM — façam juntos no começo do dia. Não deixe para 'depois', porque o 'depois' nunca chega.",
    mar_ldr1: "Energia e entusiasmo contagiantes. Ele levanta o astral do time só com a presença. Celebre isso — ele precisa sentir que sua energia é valorizada.",
    mar_ldr2: "Reconhecimento emocional. O ENFP + Neuroticismo 84 precisa de validação constante. Um 'bom trabalho' sincero vale mais que qualquer bônus.",
    mar_ldr3: "Rotina flexível. Não o prenda em processos rígidos. O ENFP + Equilibrado precisa de variedade. Alterne tarefas, rotas, desafios.",
    mar_ldr4: "Cuidado com a inconsistência. Dias de baixa podem ser muito baixos. Quando notar queda de energia, intervenha cedo com conversa leve — não cobrança.",
    mar_ldr5: "Não o coloque em cenários de alta rejeição contínua sem pausa. Neuroticismo 84 + ENFP = burnout por rejeição é real. Alterne com tarefas de relacionamento/retornos.",
    mar_ldr6: "Use-o como 'ice breaker' em visitas duplas. Sua energia ENFP + Equilibrado desarma donos difíceis. Depois passe a bola para um BD mais estruturado.",
    mar_risk1: "Neuroticismo 84 é o maior ponto de atenção. Sem apoio emocional, o turnover de humor pode afetar relacionamentos com restaurantes e com o time.",
    mar_risk2: "Consciência 74 + ausência de estrutura = follow-up inconsistente. Ele pode esquecer de atualizar o CRM ou de fazer o retorno prometido.",
    mar_risk3: "Check-in 2x por semana (curto, 5 min) focado em sentimento e energia. Pergunte 'como você está se sentindo hoje?' — ele precisa ser visto como pessoa, não só como performer.",
    mar_risk4: "Em dias de muita rejeição, mande uma mensagem curta: 'vi que hoje foi pesado. Amanhã é outro dia.' Neuroticismo alto precisa saber que o líder está de olho sem julgar.",
    // Victor
    vic_summary: "Victor é o clássico perfil de líder natural com mente analítica. O ENTJ-A traz visão estratégica e assertividade máximas. O DISC Técnico adiciona uma camada rara: ele não quer só liderar, quer entender profundamente os sistemas antes de agir. No Big Five, a combinação de extroversão muito alta (100) com abertura recorde (110) e neuroticismo baixo (51) mostra alguém que mergulha em situações novas com confiança e sem medo.",
    vic_superpower: "Consegue entender o produto tecnicamente E vender a visão estratégica para o dono do restaurante ao mesmo tempo. Poucos BDs fazem os dois.",
    vic_blindspot: "Modéstia muito baixa (8) + raiva alta (13) = quando frustrado, pode ser impositivo ou parecer arrogante com o restaurante. Não lida bem com contrariedade.",
    vic_com1: "Na prospecção, vai direto ao ponto e transmite autoridade. Donos de restaurante confiam rápido nele porque fala com segurança e domínio técnico.",
    vic_com2: "Na explicação técnica (comissão, logística, app), é o melhor do time. O DISC Técnico faz ele querer entender antes de explicar, então não enrola.",
    vic_com3: "No convencimento, pode pressionar demais. Se o dono resiste, Victor tende a insistir com mais pressão em vez de mudar a abordagem. A raiva alta faz ele perder a paciência com objeções repetidas.",
    vic_com4: "Treine com ele: quando o dono disser 'não' pela 2ª vez, mude os argumentos em vez de repetir mais alto. Role-plays de objeção semanais.",
    vic_ldr1: "Feedback direto e objetivo. Não precisa de rodeios — prefere saber exatamente o que está errado e o que precisa mudar. Perde respeito por líderes que 'passam a mão na cabeça'.",
    vic_ldr2: "Dê autonomia com metas claras. O ENTJ-A precisa sentir controle. Microgerenciar o Victor frustra rápido. Defina o resultado esperado e deixe ele escolher o caminho.",
    vic_ldr3: "Desafie-o intelectualmente. Com intelecto 20/20 no Big Five, ele precisa sentir que está aprendendo e crescendo. Envolva-o em discussões de estratégia da operação.",
    vic_ldr4: "Não o corrija na frente de outros BDs. Autoconsciência baixa (5) não significa que ele não se importa — significa que ele não demonstra. Com modéstia baixa, correção pública vira confronto.",
    vic_ldr5: "Ele pode tentar 'liderar' outros BDs mesmo sem ser BDM. Assertividade 20/20 faz ele assumir o controle naturalmente. Use isso a seu favor delegando responsabilidades, não brigando.",
    vic_ldr6: "Faça do Victor o 'padrinho' técnico dos BDs novos. Ele se sente valorizado e você canaliza a liderança natural dele de forma construtiva.",
    vic_risk1: "Se sentir que não está sendo desafiado ou que o trabalho é repetitivo, desmotiva rápido. Abertura 110 = precisa de novidade. Rotina pura mata o Victor.",
    vic_risk2: "Em dias ruins (muita rejeição), a raiva alta pode deixá-lo ríspido com restaurantes ou colegas. Monitore o humor em semanas de meta apertada.",
    vic_risk3: "Check-in rápido 1x por semana (5 min, não precisa ser formal). Pergunte: 'O que está te travando?' — ele prefere resolver problemas a falar de sentimentos.",
    // Rafael
    raf_summary: "Rafael é o BD mais 'humano' do time. O ENFJ-A é o perfil que naturalmente se importa com as pessoas e cria conexões genuínas. No Big Five, a combinação de simpatia máxima (20), emoções positivas máximas (20) e moralidade muito alta (19) cria alguém que vence pela empatia. Amabilidade alta (92) + neuroticismo muito baixo (46) = emocionalmente estável e agradável de estar por perto.",
    raf_superpower: "Cria rapport instantâneo. É o BD que o dono do restaurante vai chamar no WhatsApp fora do horário porque gosta dele. Relacionamentos de longo prazo são o forte dele.",
    raf_blindspot: "Modéstia baixa (8) combinada com cooperação muito alta (18) cria tensão: ele sabe que é bom, mas evita conflito. Pode ceder demais na negociação para manter a relação boa.",
    raf_com1: "Na prospecção, aquece leads como ninguém. Donos de restaurante se abrem rápido com ele. Entende a dor do negócio porque escuta de verdade.",
    raf_com2: "No convencimento, usa storytelling natural. O ENFJ-A conecta os benefícios do produto com a realidade emocional do dono ('imagina seu restaurante aparecendo para 50 mil pessoas nessa região').",
    raf_com3: "Na explicação técnica, pode simplificar demais. Intelecto neutro (12) e imaginação baixa (11) no Big Five = prefere falar de pessoas, não de sistemas. Se o dono pedir detalhes técnicos complexos, o Rafael pode travar.",
    raf_com4: "Cooperação 18/20 = pode aceitar condições ruins para não 'estragar' a relação. Cuidado com descontos ou concessões excessivos.",
    raf_com5: "Crie um 'cheat sheet' técnico para ele. 5 perguntas técnicas mais comuns + respostas prontas. Ele não precisa dominar tudo, só ter segurança nas respostas mais frequentes.",
    raf_ldr1: "Reconhecimento público funciona muito bem. Emoções positivas 20/20 = ele se alimenta de energia positiva. Elogie na frente do time quando ele fechar uma boa negociação.",
    raf_ldr2: "Feedback construtivo, nunca destrutivo. O ENFJ-A processa a crítica internamente mesmo parecendo aceitar bem. Seja específico: 'na negociação X, tente Y na próxima' em vez de 'você precisa melhorar em negociação'.",
    raf_ldr3: "Envolva-o no onboarding de BDs novos. Ele é o mentor natural do time — se realiza ajudando os outros (altruísmo 15) e melhora a cultura.",
    raf_ldr4: "Não confunda simpatia com falta de ambição. Esforço por realização 15 e atividade 13 = ele quer crescer, mas no ritmo dele. Pressão excessiva por resultado seco sem contexto humano desmotiva.",
    raf_ldr5: "Nos 1:1s, comece perguntando como ele está se sentindo com o time antes de entrar nos números. Ele rende melhor quando se sente cuidado como pessoa.",
    raf_risk1: "Pode virar 'amigo' do restaurante em vez de parceiro comercial. A linha é tênue — se ele evitar cobrar resultado ou renegociar termos com medo de afetar a relação, o resultado sofre.",
    raf_risk2: "Cautela baixa (11) = pode tomar decisões rápidas na negociação sem pensar nas consequências. Aceitar coisas que depois são difíceis de reverter.",
    raf_risk3: "Revise com ele as 3 primeiras negociações fechadas. Identifiquem juntos se ele cedeu demais em algum ponto e criem um 'piso' claro de condições mínimas aceitáveis.",
    // Milena
    mil_summary: "Milena é ENFJ-A como o Rafael, mas com uma configuração de Big Five bem diferente. Extroversão mais moderada (80 contra 96 do Rafael), abertura menor (74) e neuroticismo um pouco maior (59). Isso cria uma BD mais cautelosa, metódica e consistente. Cooperação muito alta (18) + moralidade alta (18) = pessoa extremamente confiável e ética.",
    mil_superpower: "Consistência e confiabilidade. Não é quem fecha mais rápido, mas é quem nunca queima um lead nem cria problema com restaurante. Dever alto (16) = cumpre o que promete.",
    mil_blindspot: "Imaginação baixa (11) + cautela baixa (11) é uma combinação curiosa: ela não é muito criativa nas abordagens E ao mesmo tempo pode agir sem pensar muito. Precisa de scripts e processos claros.",
    mil_com1: "Na prospecção, transmite confiança e seriedade. Donos de restaurante mais conservadores ou desconfiados se sentem seguros com ela. Não é agressiva, é consistente.",
    mil_com2: "No convencimento, a cooperação alta faz dela excelente em negociações ganha-ganha. Ela naturalmente encontra o ponto que funciona para os dois lados.",
    mil_com3: "Na explicação técnica, abertura e intelecto mais moderados significam que ela pode não ter a mesma fluência do Victor. Se a conversa ficar muito técnica ou abstrata, ela pode perder confiança.",
    mil_com4: "Gregarismo baixo (11) combinado com extroversão menor sugere que visitas em alto volume podem ser mais desgastantes para ela. Monitore fadiga.",
    mil_com5: "Dê à Milena contas que exigem relacionamento de longo prazo e confiança — restaurantes de bairro, negócios familiares. Ela brilha no follow-up, não na 'conquista relâmpago'.",
    mil_ldr1: "Feedback estruturado e previsível. Agende 1:1s fixos com pauta clara. Ela rende melhor quando sabe o que esperar. Surpresas a desestabilizam mais que aos outros (neuroticismo 59 = o mais alto do time).",
    mil_ldr2: "Valorize consistência, não só picos. Ela pode se sentir invisível se você só elogia quem fecha mais. Reconheça: 'Milena, nenhum dos seus restaurantes reclamou esse mês — isso é raro e vale muito'.",
    mil_ldr3: "Delegue tarefas de processo e organização para ela. Dever 16 + cooperação 18 = ela vai criar os controles que o time precisa e vai gostar de fazer.",
    mil_ldr4: "Neuroticismo mais alto que o resto do time. Em semanas de pressão, verifique se ela não está internalizando estresse. Ela não vai te contar — autoconsciência baixa (11) faz ela subestimar o próprio burnout.",
    mil_ldr5: "Coloque-a em dupla com o Victor nas primeiras semanas em contas mais técnicas. Ela aprende por observação e ele gosta de ensinar. Funciona para os dois.",
    mil_risk1: "Se a meta for agressiva demais sem suporte, o neuroticismo mais alto pode virar ansiedade (12 neutro). Ela é a mais suscetível do time a pressão mal calibrada.",
    mil_risk2: "Imaginação baixa = pode ficar 'presa' numa abordagem que não funciona sem conseguir pivotar sozinha. Precisa de coaching mais ativo que os outros.",
    mil_risk3: "Na primeira semana, faça pelo menos 2 visitas acompanhadas com ela. Não para avaliar — para ela te ver negociando e absorver abordagens que possa replicar.",
    // Lucas
    luc_summary: "Lucas é o perfil mais complexo do time. O ENTP-T (Turbulento) é radicalmente diferente dos outros 3 — é o único T (turbulento em vez de assertivo) e o único P (percepção em vez de julgamento). Isso significa que ele questiona mais, duvida mais de si e é mais flexível/improvisador. No Big Five, neuroticismo maior (68) com vulnerabilidade alta (15) e imoderação alta (15) mostram alguém com muita energia, mas que pode desregular sob pressão.",
    luc_superpower: "Criatividade e adaptabilidade. ENTP + imaginação 20/20 + intelecto 17 = ele inventa abordagens novas que ninguém pensou. É o BD que vai achar um jeito diferente de convencer aquele restaurante que todo mundo já tentou.",
    luc_blindspot: "O -T (turbulento) significa que ele duvida de si. Combinado com vulnerabilidade 15 e imoderação 15, dias de muita rejeição podem gerar uma espiral: desânimo → impulsividade → decisões ruins → mais desânimo.",
    luc_com1: "Na prospecção, é o mais criativo. Vai achar leads que os outros não pensaram, vai abordar de formas inusitadas, vai adaptar o pitch em tempo real. Imaginação 20 + aventurança 13 = nunca faz a mesma coisa duas vezes.",
    luc_com2: "No convencimento, usa argumentação lógica sofisticada. O ENTP adora debater — se o dono trouxer objeções, o Lucas vai gostar do desafio e construir contra-argumentos elaborados.",
    luc_com3: "Organização neutra (12) + autodisciplina baixa (10) = a parte burocrática do processo pode ser negligenciada. Relatórios, follow-ups estruturados, atualização de CRM — ele vai procrastinar.",
    luc_com4: "Confiança baixa no Big Five (8/20) = pode ser excessivamente desconfiado dos donos de restaurante, o que atrasa o fechamento. Pode interpretar hesitação como má-fé.",
    luc_com5: "Crie checkpoints obrigatórios de processo (ex.: 'antes de sair do restaurante, atualize o status no CRM'). Ele precisa de gatilhos externos porque a autodisciplina interna é limitada.",
    luc_ldr1: "Debate intelectual. O ENTP precisa questionar para engajar. Se você disser 'faça assim', ele resiste. Se você disser 'o que você acha que funciona aqui?', ele engaja e executa melhor.",
    luc_ldr2: "Feedback frequente e honesto, mas cuidado com o tom. O -T (turbulento) já é autocrítico demais. Reforce primeiro o que está bom antes de corrigir. Proporção 3:1 (3 elogios para 1 correção).",
    luc_ldr3: "Dê espaço para ele propor ideias novas. Se ele sugerir uma abordagem diferente para um restaurante, deixe testar (dentro do razoável). ENTPs que não podem inovar ficam apáticos.",
    luc_ldr4: "Não o compare publicamente com o Victor. São perfis opostos — o Victor é o executor confiante, o Lucas é o criativo inseguro. Comparação vai destruir a autoconfiança do Lucas.",
    luc_ldr5: "Cooperação muito alta (20) + amabilidade menor que os outros (76) = ele quer harmonia mas pode ser mais seco/direto. Pode parecer 'frio' mas na verdade está tentando ajudar do jeito dele.",
    luc_ldr6: "Em dias de muita rejeição, mande uma mensagem curta: 'vi que hoje foi pesado. Amanhã é outro dia.' O -T precisa saber que o líder está de olho sem julgar.",
    luc_risk1: "Vulnerabilidade 15 + Imoderação 15 = em momentos de estresse, pode tomar decisões impulsivas (prometer algo ao restaurante que não consegue cumprir, desistir de um bom lead cedo demais).",
    luc_risk2: "Maior risco de burnout entre os BDs. Neuroticismo 68 (o mais alto do time) + turbulência ENTP-T = ele se cobra muito e esconde. Se ficar quieto demais, é sinal de alerta.",
    luc_risk3: "Autodisciplina 10/20 é a mais baixa do time. Sem processo estruturado, a produtividade oscila muito de um dia para o outro.",
    luc_risk4: "Estruture a semana dele mais que a dos outros: segunda = planejamento conjunto, quarta = check-in rápido, sexta = revisão. Ele precisa de 'guardrails', não de microgerenciamento.",

    // Manager profile
    manager_summary: "Caio is ENFJ-A (Protagonist) with DISC Thinker (Thinker, measured pace) and a striking Big Five: very high Agreeableness (101), high Conscientiousness (96), high Extraversion (82), moderate Openness (74), and low Neuroticism (40). He is a leader who unites empathy and structure — the ENFJ inspires and cares for people, while Conscientiousness 96 ensures process, follow-up, and predictability. Neuroticism 40 keeps him calm under pressure. The DISC Thinker adds a deliberative trait: he plans before acting and values teamwork. He is the counterpoint to his own team: he leads a team with two ENTJ-A (Commander) and one ENFP (Campaigner) while being a people-oriented Protagonist himself — and it is precisely Agreeableness 101 that keeps this group of strong personalities working together.",
    manager_superpower: "Connecting, inspiring, and structuring at the same time. Agreeableness 101 + ENFJ make each BD feel they have a leader who genuinely cares — engagement comes from loyalty, not fear. And Conscientiousness 96 ensures that empathy is accompanied by organization, rituals, and follow-up. He is a leader who welcomes AND delivers.",
    manager_blindspot: "The combination of Agreeableness 101 + ENFJ + Thinker can generate conflict avoidance. He tends to postpone difficult conversations (hard feedback, firm target enforcement, termination decisions) to preserve harmony. The Thinker reinforces the pattern: instead of acting decisively, he may 'think a little more' and miss the window for action.",
    manager_style_1: "Leadership through connection and trust. ENFJ + Agreeableness 101 make each BD feel seen and valued. The team performs more out of loyalty to the leader than out of pressure — which generates long-term engagement and low turnover.",
    manager_style_2: "Management with structure. Conscientiousness 96 + Thinker = well-organized processes, rituals, and follow-up. The team works in a predictable environment, which reduces anxiety and increases consistency.",
    manager_style_3: "Calm under pressure. Neuroticism 40 makes him an anchor of stability in tight-target weeks. The team does not inherit the leader's panic — a rare and valuable asset in sales.",
    manager_style_4: "Agreeableness 101 can turn into 'too-nice boss'. The risk of softening feedback that needed to be hard, of tolerating mediocre performance to avoid discomfort, and of demanding less than the target requires.",
    manager_style_5: "Thinker + ENFJ = slow decision in situations that require speed. The tendency to 'consider and plan' can delay decisions that should be immediate (pivoting approach, cutting a cold lead, reallocating a BD).",
    manager_style_6: "Install a 'decision trigger': when you notice you are postponing a difficult conversation, schedule it within 24h. Training 'gentle clarity' — being direct WITH care — is the muscle he most needs to develop.",
    manager_self_1: "Protect blocks of strategic reflection. Thinker + ENFJ perform better with reserved time to think (review the funnel, prepare 1:1s, plan each BD's development). Without it, he turns into a 'firefighter' putting out fires.",
    manager_self_2: "Turn care into ritual. Use Conscientiousness 96 to create fixed routines (weekly 1:1, CRM review, lead follow-up) that make attention to people systematic, not an occasional herculean effort.",
    manager_self_3: "Delegate technical enforcement and use your strength in development. You don't need to be the 'executioner': use peer accountability among BDs (Natalia for process, Vinicius for strategy) and reserve your energy for coaching and growth.",
    manager_self_4: "Risk of the 'emotional superhero': Agreeableness 101 + ENFJ make him absorb the whole team's stress. Without a release valve (mentor, peers, reflection), he accumulates others' emotional load without processing his own.",
    manager_self_5: "The Thinker can turn into 'analysis paralysis' in people management. When a BD clearly underperforms, he may postpone the conversation waiting for 'more data' instead of acting.",
    manager_self_6: "Schedule a biweekly check-in with your manager or a trusted peer to calibrate difficult conversations before having them. A 'rehearsal' reduces anxiety and increases clarity.",
    manager_risk_1: "Burnout from 'taking care of everyone'. ENFJ + Agreeableness 101 + the responsibility of managing a team of strong personalities = he puts the team's needs above his own. Emotional wear is the biggest risk.",
    manager_risk_2: "Imbalance between firmness and empathy. If he leans too much toward empathy, the target suffers; if he forces artificial toughness, he may sound inauthentic and lose the team's trust. The middle ground is the central challenge.",
    manager_risk_3: "Slow decisions in windows that close fast. The Thinker wants data before acting, but in sales there are moments that don't wait. Delaying can cost deals or the team's credibility.",
    manager_risk_4: "Keep a visible 'list of postponed conversations' and resolve at least ONE per week. Frequent difficult conversations, in small doses, make each one lighter.",
    // Vinicius
    vini_summary: "Vinicius is ENTJ-A (Assertive Commander) with mapped Big Five and DISC Finisher (S+C — Steady Pace, Detail Perspective, Event Focus). It's a rare combination: the natural leader archetype (ENTJ-A + extroversion 88) with a layer of thoughtfulness, caution, and loyalty to process (Finisher). Agreeableness 89 (Big Five) and the supportive/patient/dependable traits of the Finisher make him a warmer and more reliable ENTJ than the stereotype. At the same time, moderate conscientiousness 66 and the Finisher's focus on 'events' indicate that he prioritizes execution and results over bureaucracy — detail-oriented when necessary, but not obsessed with process. A more balanced and less extreme version than Victor (Technical + openness 110).",
    vini_superpower: "Combining commercial presence with connection and reliability. ENTJ-A + extroversion 88 + agreeableness 89 make him someone who conveys authority AND likability. The Finisher adds a rare differential for an ENTJ: patience and dependability. Restaurant owners trust not only his energy, but the feeling that he will follow the process through to the end — it's not just charm, it's commitment.",
    vini_blindspot: "The conflict ENTJ-A (fast action) vs. Finisher (cautious deliberation). Moderate conscientiousness 66 reinforces the tension: he VALUES caution and details (Finisher), but ENTJ-A pushes for speed and results. This can generate inconsistency — sometimes he is super detail-oriented (when Finisher dominates), sometimes he skips steps (when ENTJ-A dominates). The classic risk of sounding imposing is mitigated by agreeableness 89 and the Finisher's supportive trait, but still appears under pressure.",
    vini_com1: "Direct prospecting, with authority AND warmth. Agreeableness 89 + Finisher (supportive, dependable) make him an ENTJ who creates quick trust — the owner feels they are talking to someone who will deliver on promises.",
    vini_com2: "Strategic vision + Finisher details. He is strong at selling the restaurant's future AND confidently explaining operational details when the owner needs them.",
    vini_com3: "ENTJ-A vs. Finisher tension on speed. The Finisher wants to deliberate before acting; ENTJ-A wants to act now. In tight-target weeks, ENTJ-A wins and he may skip process steps.",
    vini_com4: "Under pressure, he may force persuasion. Even with high agreeableness and supportive traits, ENTJ-A impatience appears as repeated insistence.",
    vini_com5: "Use the Finisher's steady pace as an advantage: in visits with more distrustful owners, put ENTJ-A aside and let the Finisher 'think together with the owner'.",
    vini_ldr1: "Direct and objective feedback. He doesn't need beating around the bush — prefers to know exactly what's wrong and what needs to change. Loses respect for those who 'sweep things under the rug'.",
    vini_ldr2: "Autonomy with clear goals. ENTJ-A needs to feel in control. Define the expected outcome and let him choose the path — micromanaging frustrates quickly.",
    vini_ldr3: "Intellectual challenge. He needs to feel he is learning and growing. Involve him in operation strategy discussions, not just visit execution.",
    vini_ldr4: "Don't correct in public. Correction in front of colleagues becomes confrontation with an ENTJ. Take the adjustment to a 1:1.",
    vini_ldr5: "Unlike Victor (Technical + openness 110), Vinicius is more cautious and less extreme. Don't assume he will be as fast as Victor at pivoting or experimenting.",
    vini_ldr6: "Use him as a bridge between the team and the client. Finisher (dependable, supportive) + ENTJ (authority) = ideal profile for leads that demand trust before decision.",
    vini_risk1: "Openness 76 is moderately high: tolerates routine but without novelty engagement drops. Less intense than Victor, but still present.",
    vini_risk2: "Conscientiousness 66 is the central point. Finisher values process, but ENTJ-A wants speed. Inconsistency in follow-up/CRM management is the main risk.",
    vini_risk3: "Quick check-in 1x per week (5 min) focused on pipeline and follow-up. Ask 'what's blocking the close?' — he prefers solving concrete problems.",
    // Natalia
    nat_summary: "Natalia is ENTJ-A (Assertive Commander) with DISC Thinker (Analytical) — a rare and powerful combination. ENTJ brings natural leadership, strategic vision, and assertiveness. Thinker adds meticulousness, data orientation, and attention to detail. In Big Five, record Conscientiousness (116) shows someone extremely organized, responsible, and process-oriented. Very low Neuroticism (38) makes her the most emotionally stable on the team. High Extroversion (93) + High Agreeableness (93) create a leader who is simultaneously assertive and pleasant — she leads without being rude.",
    nat_superpower: "Can lead with precision. The combination of strategic vision (ENTJ) + meticulousness (Thinker) + Conscientiousness 116 makes her someone who not only defines where to go, but also ensures each step is taken correctly. The most reliable BD for complex processes.",
    nat_blindspot: "Moderate openness (65) combined with Thinker can make her less flexible to new approaches or improvisations. She may prefer the tested method over the untested experiment. In situations requiring quick pivoting, she may hesitate.",
    nat_com1: "Structured prospecting. She prepares arguments with data and anticipates objections. Thinker + Conscientiousness 116 make her a preparation machine.",
    nat_com2: "Impeccable process execution. Checklists, follow-ups, updated CRM — she doesn't let anything slip. The restaurant owner feels they are talking to a professional.",
    nat_com3: "May seem cold or overly rational. Agreeableness 93 mitigates, but ENTJ + Thinker + data focus can sound like a 'robot' to more emotional owners.",
    nat_com4: "Tendency to want all answers before acting. Thinker + Conscientiousness 116 can generate analysis paralysis in high-speed weeks.",
    nat_com5: "Give her preparation time. If it's a complex visit, notify in advance. Thinker needs time to process and structure.",
    nat_com6: "Train improvisation: role-plays where the owner changes subject unexpectedly. Practice pivoting from technical to emotional and vice versa.",
    nat_ldr1: "Execution recognition. She needs to feel that work quality is noticed. Celebrate precision, not just results.",
    nat_ldr2: "Priority clarity. ENTJ + Thinker + Conscientiousness 116 wants to know exactly what is most important now. Priority ambiguity generates anxiety.",
    nat_ldr3: "Autonomy with responsibility. She wants control over HOW to do it, but also wants to be held accountable for results. Micromanagement is unnecessary — she already pushes herself hard.",
    nat_ldr4: "Avoid last-minute changes without explanation. Thinker + Conscientiousness 116 needs time for recalibration. Abrupt changes are stressful.",
    nat_ldr5: "Don't force her to improvise. She can do it, but it's not natural. Give space for preparation even in unpredictable scenarios.",
    nat_ldr6_timebox: "Establish a 'timebox' for analysis: 'you have 30 min to review this contract, then send it.' This frees her from the search for infinite perfection.",
    nat_risk1: "Conscientiousness 116 is a superpower, but can turn into obsession with control. If process changes without notice, she can get deeply frustrated.",
    nat_risk2: "Openness 65 + Thinker = natural resistance to experiments. In a fast-changing market (like delivery), this can delay adaptations.",
    nat_risk3: "Short weekly check-in (10 min) focused on priorities and blockers. Ask 'what needs clarity?' — she values precision over vague empathy.",
    // Marcelo
    mar_summary: "Marcelo is ENFP (Campaigner) with DISC Balanced — the most energetic and adaptable profile on the team. ENFP brings enthusiasm, creativity, and genuine concern for people. DISC Balanced means he doesn't have a fixed dominant style: he can alternate between direct, persuasive, analytical, or supportive approaches as the situation demands. In Big Five, very high Extroversion (104) + high Openness (95) + high Neuroticism (84) create someone intensely social, creative, and emotionally expressive. He is the BD who will 'feel' the restaurant before selling to it.",
    mar_superpower: "Social adaptability and creativity. Can read the environment in seconds and adjust the conversation tone instantly. DISC Balanced + ENFP makes him a 'commercial chameleon' — works with every type of restaurant owner.",
    mar_blindspot: "High Neuroticism (84) + moderate Conscientiousness (74) = can oscillate a lot in mood and productivity. Good days are excellent; bad days can be very bad. Without external structure, consistency suffers.",
    mar_com1: "Warm and genuine prospecting. ENFP + Balanced creates quick connection. Restaurant owners feel that he truly cares — because he does.",
    mar_com2: "Creativity in approaches. Can create customized pitches on the spot, adapting to the owner's style. Doesn't use a fixed script.",
    mar_com3: "Tendency to talk too much. Extroversion 104 + ENFP = can get lost in conversation and forget the commercial objective of the visit. Needs a clear 'north star'.",
    mar_com4: "Under rejection, can take it personally. Neuroticism 84 = the frustration of 'no' affects mood and next-day performance.",
    mar_com5: "Give him creative freedom, but with light structure. A simple 3-point checklist per visit keeps focus without suffocating spontaneity.",
    mar_com6: "Create a daily 10-min ritual for CRM update — do it together at the start of the day. Don't leave it for 'later', because later never comes.",
    mar_ldr1: "Contagious energy and enthusiasm. He lifts the team's spirits just with his presence. Celebrate this — he needs to feel his energy is valued.",
    mar_ldr2: "Emotional recognition. ENFP + Neuroticism 84 needs constant validation. A sincere 'good job' is worth more than any bonus.",
    mar_ldr3: "Flexible routine. Don't bind him to rigid processes. ENFP + Balanced needs variety. Alternate tasks, routes, challenges.",
    mar_ldr4: "Watch out for inconsistency. Low days can be very low. When you notice energy drop, intervene early with light conversation — not pressure.",
    mar_ldr5: "Don't put him in scenarios of continuous high rejection without breaks. Neuroticism 84 + ENFP = rejection burnout is real. Alternate with relationship/return tasks.",
    mar_ldr6: "Use him as an 'ice breaker' in paired visits. His ENFP + Balanced energy disarms difficult owners. Then pass the ball to a more structured BD.",
    mar_risk1: "Neuroticism 84 is the biggest watch-out. Without emotional support, mood turnover can affect relationships with restaurants and the team.",
    mar_risk2: "Conscientiousness 74 + lack of structure = inconsistent follow-up. He may forget to update CRM or make the promised return call.",
    mar_risk3: "Check-in 2x per week (short, 5 min) focused on feeling and energy. Ask 'how are you feeling today?' — he needs to be seen as a person, not just a performer.",
    mar_risk4: "On high-rejection days, send a short message: 'I see today's tough. Tomorrow is another day.' High Neuroticism needs to know the leader is watching without judging.",
    // Victor
    vic_summary: "Victor is the classic natural leader profile with an analytical mind. ENTJ-A brings maximum strategic vision and assertiveness. DISC Technical adds a rare layer: he not only wants to lead, but wants to deeply understand systems before acting. In Big Five, the combination of very high extroversion (100) with record openness (110) and low neuroticism (51) shows someone who dives into new situations with confidence and without fear.",
    vic_superpower: "Can understand the product technically AND sell the strategic vision to the restaurant owner at the same time. Few BDs do both.",
    vic_blindspot: "Very low modesty (8) + high anger (13) = when frustrated, can be imposing or seem arrogant with the restaurant. Doesn't take contradiction well.",
    vic_com1: "In prospecting, goes straight to the point and conveys authority. Restaurant owners trust him quickly because he speaks with security and technical mastery.",
    vic_com2: "In technical explanations (commission, logistics, app), he is the best on the team. DISC Technical makes him want to understand before explaining, so he doesn't ramble.",
    vic_com3: "In persuasion, may push too hard. If the owner resists, Victor tends to insist with more pressure instead of changing approach. High anger makes him lose patience with repeated objections.",
    vic_com4: "Train with him: when the owner says 'no' for the 2nd time, change arguments instead of repeating louder. Weekly objection role-plays.",
    vic_ldr1: "Direct and objective feedback. No need for beating around the bush — he prefers to know exactly what's wrong and what needs to change. Loses respect for leaders who 'sweep things under the rug'.",
    vic_ldr2: "Give autonomy with clear goals. ENTJ-A needs to feel in control. Micromanaging Victor will frustrate him quickly. Define the expected outcome and let him choose the path.",
    vic_ldr3: "Challenge him intellectually. With intellect 20/20 in Big Five, he needs to feel he is learning and growing. Involve him in operation strategy discussions.",
    vic_ldr4: "Don't correct him in front of other BDs. Low self-consciousness (5) doesn't mean he doesn't care — it means he doesn't show it. With low modesty, public correction turns into confrontation.",
    vic_ldr5: "He may try to 'lead' other BDs even without being BDM. Assertiveness 20/20 makes him naturally take control. Use this to your advantage by delegating responsibilities, not fighting it.",
    vic_ldr6: "Make Victor the technical 'buddy' for newer BDs. He feels valued and you channel his natural leadership constructively.",
    vic_risk1: "If he feels he's not being challenged or that work is repetitive, he will demotivate quickly. Openness 110 = needs novelty. Pure routine kills Victor.",
    vic_risk2: "On bad days (lots of rejection), high anger can make him harsh with restaurants or colleagues. Monitor his mood in tight-target weeks.",
    vic_risk3: "Quick check-in 1x per week (5 min, doesn't need to be formal). Ask: 'What's blocking you?' — he prefers solving problems to talking about feelings.",
    // Rafael
    raf_summary: "Rafael is the most 'human' BD on the team. ENFJ-A is the profile that naturally cares about people and creates genuine connections. In Big Five, the combination of maximum sympathy (20), maximum positive emotions (20), and very high morality (19) creates someone who wins through empathy. High agreeableness (92) + very low neuroticism (46) = emotionally stable and pleasant to be around.",
    raf_superpower: "Creates instant rapport. He is the BD that the restaurant owner will WhatsApp after hours because they like him. Long-term relationships are his strength.",
    raf_blindspot: "Low modesty (8) combined with very high cooperation (18) creates tension: he knows he's good, but avoids conflict. May concede too much in negotiation to keep the relationship good.",
    raf_com1: "In prospecting, he warms up leads like no one else. Restaurant owners open up to him quickly. Understands business pain because he truly listens.",
    raf_com2: "In persuasion, uses natural storytelling. ENFJ-A connects product benefits with the owner's emotional reality ('imagine your restaurant appearing to 50 thousand people in this region').",
    raf_com3: "In technical explanation, may oversimplify. Neutral intellect (12) and low imagination (11) in Big Five = he prefers talking about people, not systems. If the owner asks complex technical details, Rafael may freeze.",
    raf_com4: "Cooperation 18/20 = he may accept bad conditions to not 'ruin' the relationship. Watch out for excessive discounts or concessions.",
    raf_com5: "Create a technical 'cheat sheet' for him. 5 most common technical questions + ready answers. He doesn't need to master everything, just have security on the most frequent answers.",
    raf_ldr1: "Public recognition works very well. Positive emotions 20/20 = he feeds on positive energy. Praise in front of the team when he closes a good negotiation.",
    raf_ldr2: "Constructive feedback, never destructive. ENFJ-A processes criticism internally even while seeming to take it well. Be specific: 'in negotiation X, try Y next time' instead of 'you need to improve in negotiation'.",
    raf_ldr3: "Involve him in new BD onboarding. He is the team's natural mentor — feels fulfilled helping others (altruism 15) and improves culture.",
    raf_ldr4: "Don't confuse sympathy with lack of ambition. Achievement striving 15 and activity 13 = he wants to grow, but at his pace. Excessive pressure for dry results without human context demotivates him.",
    raf_ldr5: "In 1:1s, start by asking how he's feeling with the team before getting into numbers. He performs better when he feels cared for as a person.",
    raf_risk1: "May become the restaurant's 'friend' instead of commercial partner. The line is thin — if he avoids demanding results or renegotiating terms for fear of affecting the relationship, results suffer.",
    raf_risk2: "Low caution (11) = may make quick decisions in negotiation without thinking about consequences. Accepting things that are later hard to reverse.",
    raf_risk3: "Review with him the first 3 closed negotiations. Identify together if he conceded too much at any point and create a clear 'floor' of minimum acceptable conditions.",
    // Milena
    mil_summary: "Milena is ENFJ-A like Rafael, but with a very different Big Five configuration. More moderate extroversion (80 vs Rafael's 96), lower openness (74), and slightly higher neuroticism (59). This creates a more cautious, methodical, and consistent BD. Very high cooperation (18) + high morality (18) = extremely trustworthy and ethical person.",
    mil_superpower: "Consistency and reliability. Not the one who will close the deal fastest, but the one who will never burn a lead or create problems with a restaurant. High duty (16) = delivers on promises.",
    mil_blindspot: "Low imagination (11) + low caution (11) is a curious combination: she is not very creative in approaches AND at the same time may act without thinking much. Needs clear scripts and processes.",
    mil_com1: "In prospecting, conveys confidence and seriousness. More conservative or distrustful restaurant owners will feel safe with her. Not aggressive, consistent.",
    mil_com2: "In persuasion, high cooperation makes her excellent in win-win negotiations. She naturally finds the point that works for both sides.",
    mil_com3: "In technical explanations, more moderate openness and intellect mean she may not have the same fluency as Victor. If the conversation gets too technical or abstract, she may lose confidence.",
    mil_com4: "Low gregariousness (11) combined with lower extroversion suggests that high-volume visits may be more draining for her. Monitor fatigue.",
    mil_com5: "Give Milena accounts that require long-term relationships and trust — neighborhood restaurants, family businesses. She shines in follow-up, not in 'lightning conquest'.",
    mil_ldr1: "Structured and predictable feedback. Schedule fixed 1:1s with clear agenda. She performs better when she knows what to expect. Surprises destabilize her more than others (neuroticism 59 = highest on the team).",
    mil_ldr2: "Value consistency, not just peaks. She may feel invisible if you only praise those who close more. Recognize: 'Milena, none of your restaurants complained this month — that's rare and matters a lot'.",
    mil_ldr3: "Delegate process and organization tasks to her. Duty 16 + cooperation 18 = she will create the controls the team needs and will enjoy doing it.",
    mil_ldr4: "Higher neuroticism than the rest of the team. In pressure weeks, check if she's not internalizing stress. She won't tell you — low self-consciousness (11) makes her underestimate her own burnout.",
    mil_ldr5: "Pair her with Victor in the first weeks on more technical accounts. She learns by observation and he likes to teach. Works for both.",
    mil_risk1: "If the target is too aggressive without support, higher neuroticism can turn into anxiety (12 neutral). She is the most susceptible on the team to poorly calibrated pressure.",
    mil_risk2: "Low imagination = may get 'stuck' in an approach that doesn't work without being able to pivot alone. Needs more active coaching than the others.",

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function tag(label, color, bg) {
  bg = bg || "transparent";
  return `<span class="tag" style="color:${color};background:${bg}">${esc(label)}</span>`;
}

function insight(item) {
  const m = INSIGHT_META[item.type] || INSIGHT_META.cuidado;
  return `<div class="insight ${item.type}">
    ${tag(t(m.label), m.color, m.bg)}
    <div class="i-text">${esc(t(item.text))}</div>
  </div>`;
}

function bigfiveBars(bigfive) {
  const max = 120;
  return Object.entries(bigfive).map(([k, v]) => {
    const ratio = v / max;
    const color = ratio >= 0.7 ? P.green : ratio >= 0.5 ? P.amber : P.blue;
    const w = Math.min(ratio * 100, 100);
    return `<div class="bigfive-bar">
      <div class="lbl">${esc(k)}</div>
      <div class="track"><div class="fill" style="width:${w}%;background:${color}"></div></div>
      <div class="val">${v}</div>
    </div>`;
  }).join("");
}

<div id="contexto" class="card card-accent" style="--accent:#4A6899">

  </p>
  <ul style="font-size:12px;color:var(--text);line-height:1.7;margin-left:18px;margin-bottom:10px">

    <li><strong>O dono já tem BATNA.</strong> O iFood é o padrão. O próprio delivery é uma alternativa. Você precisa mudar o jogo, não jogar no jogo dele.</li>
    <li><strong>A decisão é emocional, mas racionalizada.</strong> O dono decide pelo medo ("e se der errado?") ou pela ganância ("e se eu ganhar mais?"), mas justifica com números. Suas táticas precisam operar nos dois níveis.</li>

  <p style="font-size:11px;color:var(--sub);line-height:1.6">
    Este playbook adapta 9 táticas clássicas de negociação (baseadas no treinamento de Thiago Concer) ao contexto específico de venda porta a porta de plataforma de delivery para restaurantes. Cada tática inclui: o que é, como funciona, exemplo aplicado ao Keeta, e qual BD do time SMBX Santos a executa com mais naturalidade.
