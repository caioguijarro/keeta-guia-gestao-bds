<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Keeta · Guia de Gestão Individual — SMBX Santos</title>
<style>
  :root {
    --bg: #F5F4F0;
    --card: #FFFFFF;
    --border: #E6E3DC;
    --border2: #EDE9E1;
    --text: #2C2B28;
    --sub: #8C8880;
    --muted: #B8B4AC;
    --line: #D9D5CC;
    --green: #4A7C59;
    --greenBg: #EDF3EF;
    --greenLight: #C6DDD0;
    --red: #B05555;
    --redBg: #F5ECEC;
    --amber: #B8813A;
    --amberBg: #F5EFE4;
    --blue: #4A6899;
    --blueBg: #EBF0F8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    min-height: 100vh;
    color: var(--text);
    font-family: 'DM Sans', 'Segoe UI', -apple-system, sans-serif;
    padding: 28px 32px;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: #F5F4F0; }
  ::-webkit-scrollbar-thumb { background: #E6E3DC; border-radius: 2px; }

  .header { margin-bottom: 24px; }
  .header-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .logo {
    width: 24px; height: 24px; border-radius: 6px; background: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; color: #fff;
  }
  .kicker {
    font-size: 10px; font-weight: 700; color: var(--sub);
    text-transform: uppercase; letter-spacing: 0.14em;
  }
  h1.title {
    font-size: 26px; font-weight: 800; color: var(--text);
    letter-spacing: -0.03em;
    font-family: 'Playfair Display', Georgia, serif;
    line-height: 1.1;
  }
  .subtitle { font-size: 11px; color: var(--sub); margin-top: 4px; }

  .tag {
    font-size: 9px; font-weight: 700;
    border-radius: 4px; padding: 3px 8px;
    text-transform: uppercase; letter-spacing: 0.06em;
    white-space: nowrap; display: inline-block;
  }

  .tabbar {
    display: flex; gap: 2px; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tabbar button {
    background: none; border: none; padding: 10px 20px; cursor: pointer;
    font-size: 12px; font-weight: 700;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px; transition: all .15s;
    font-family: inherit;
  }
  .tabbar button.active {
    color: var(--text);
    border-bottom: 2px solid var(--text);
  }
  .tab-group-label {
    font-size: 9px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 14px;
  }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);

  .profile-header { border-top: 3px solid var(--accent); }
  .profile-row {
    display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;
    gap: 12px; flex-wrap: wrap;
  }
  h2.name {
    font-size: 22px; font-weight: 800; color: var(--text);
    font-family: 'Playfair Display', Georgia, serif; letter-spacing: -0.03em;
  }
  .role-line { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .summary-text { font-size: 12px; color: var(--text); line-height: 1.7; margin-bottom: 12px; }
  .section-title {
    font-size: 9px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }

  .bigfive-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .bigfive-bar .lbl { width: 90px; font-size: 10px; font-weight: 600; color: var(--sub); }
  .bigfive-bar .track { flex: 1; height: 6px; background: var(--border2); border-radius: 99px; overflow: hidden; }
  .bigfive-bar .fill { height: 100%; border-radius: 99px; }
  .bigfive-bar .val {
    width: 28px; font-size: 10px; font-weight: 700; color: var(--text);
    font-family: 'DM Mono', monospace; text-align: right;
  }

  .callout { border-radius: 8px; padding: 10px 14px; }
  .callout .ct-label {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }
  .callout .ct-text { font-size: 11px; color: var(--text); line-height: 1.5; }
  .super { background: var(--greenBg); border: 1px solid var(--greenLight); }
  .super .ct-label { color: var(--green); }
  .blind { background: var(--redBg); border: 1px solid var(--border2); }
  .blind .ct-label { color: var(--red); }

  .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .section-head {
    font-size: 10px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-desc { font-size: 11px; color: var(--sub); margin-bottom: 12px; }

  .insight {
    border-radius: 8px; padding: 10px 14px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .insight .i-text { font-size: 12px; color: var(--text); line-height: 1.6; flex: 1; }
  .insight.funciona { background: var(--greenBg); border: 1px solid var(--greenLight); }
  .insight.cuidado { background: var(--amberBg); border: 1px solid var(--border2); }
  .insight.acao { background: var(--blueBg); border: 1px solid var(--border2); }
  .insight.risco { background: var(--redBg); border: 1px solid var(--border2); }

  .pending-card { text-align: center; }
  .pending-card .icon { font-size: 32px; margin-bottom: 12px; }
  .pending-card .t { font-size: 16px; font-weight: 700; color: var(--red); margin-bottom: 8px; }
  .pending-card .d {
    font-size: 12px; color: var(--sub); line-height: 1.6;
    max-width: 460px; margin: 0 auto;
  }
  .pending-tags { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  details.history {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 20px; margin-bottom: 16px;
  }
  details.history summary {
    cursor: pointer; font-size: 12px; font-weight: 700; color: var(--sub);
    list-style: none;
  }
  details.history summary::before { content: "▸ "; color: var(--muted); }
  details.history[open] summary::before { content: "▾ "; }
  details.history .hist-inner { margin-top: 16px; }

  .footer {
    margin-top: 36px; padding-top: 16px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); flex-wrap: wrap; gap: 8px;
  }
</style>
</head>

let currentTab = "vinicius";

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function tag(label, color, bg) {
  bg = bg || "transparent";
  return `<span class="tag" style="color:${color};background:${bg}">${esc(label)}</span>`;
}

function insight(item) {
  const m = INSIGHT_META[item.type] || INSIGHT_META.cuidado;
  return `<div class="insight ${item.type}">
    ${tag(m.label, m.color)}
    <div class="i-text">${esc(item.text)}</div>
  </div>`;
}

function bigfiveBars(bigfive) {
  const max = 120;
  return Object.entries(bigfive).map(([k, v]) => {
    const ratio = v / max;
    const color = ratio >= 0.7 ? P.green : ratio >= 0.5 ? P.amber : P.blue;
    const w = Math.min(ratio * 100, 100);
    return `<div class="bigfive-bar">
      <div class="lbl">${esc(k)}</div>
      <div class="track"><div class="fill" style="width:${w}%;background:${color}"></div></div>
      <div class="val">${v}</div>
    </div>`;
  }).join("");
}

function pendingCard(bd) {
  const testNames = bd.pending.map(t => {
    const color = P.red, bg = P.redBg;
    return `<span class="tag" style="color:${color};background:${bg}">${esc(t)} Pendente</span>`;
  }).join(" ");
  return `<div class="card pending-card">
    <div class="icon">🧩</div>
    <div class="t">${esc(bd.name)} — Sem testes</div>
    <div class="d">${esc(bd.name.split(" ")[0])} ainda não enviou os testes de perfil. Cobrar o envio para completar o mapeamento do time e gerar a análise individual.</div>
    <div class="pending-tags">${testNames}</div>
  </div>`;
}

function profileCard(bd) {

  if (bd.mbtiLabel) badges.push(tag(bd.mbtiLabel, P.sub, P.bg));
  if (bd.disc) badges.push(tag(bd.disc, P.blue, P.blueBg));

  const bigfiveSection = bd.bigfive
    ? `<div>
        <div class="section-title">Big Five (scores totais por domínio)</div>
        ${bigfiveBars(bd.bigfive)}
      </div>`

        <div class="section-title">Big Five</div>
        <div style="font-size:11px;color:${P.sub};line-height:1.6">${tag("Pendente", P.red, P.redBg)} Resultado não enviado. A triangulação completa (MBTI + DISC + Big Five) ficará disponível quando o teste for enviado.</div>
      </div>`;

  const sourceNote = bd.source
    ? `<div style="font-size:10px;color:${P.muted};margin-top:10px">Fonte: ${esc(bd.source)}</div>`
    : "";

  const pendingNote = bd.pending && bd.pending.length
    ? `<div style="font-size:10px;color:${P.muted};margin-top:10px">Pendente: ${bd.pending.map(esc).join(", ")}</div>`
    : "";

  return `
    <div class="card profile-header" style="--accent:${bd.color}">
      <div class="profile-row">
        <div>
          <h2 class="name">${esc(bd.name)}</h2>
          <p class="role-line">BD · SMBX Santos</p>
        </div>
        <div class="badges">${badges.join("")}</div>
      </div>

      <div class="grid2">
        <div class="summary-text">${esc(bd.profile.summary)}</div>
        ${bigfiveSection}
      </div>

      <div class="grid2" style="margin-top:12px">
        <div class="callout super">
          <div class="ct-label">Superpoder</div>
          <div class="ct-text">${esc(bd.profile.superpower)}</div>
        </div>
        <div class="callout blind">
          <div class="ct-label">Ponto Cego</div>
          <div class="ct-text">${esc(bd.profile.blindspot)}</div>
        </div>
      </div>
      ${sourceNote}${pendingNote}
    </div>

    <div class="section">
      <div class="section-head"><span>📊</span> Performance no Ciclo Comercial</div>
      <p class="section-desc">Prospecção → Convencimento → Explicação Técnica</p>
      ${bd.commercial.map(insight).join("")}
    </div>

    <div class="section">
      <div class="section-head"><span>🎯</span> Como Liderar Este BD</div>
      <p class="section-desc">Feedback, motivação, delegação e acompanhamento</p>
      ${bd.leadership.map(insight).join("")}
    </div>

    <div class="section">
      <div class="section-head"><span>⚡</span> Riscos e Ações Preventivas</div>
      <p class="section-desc">Sinais de alerta e o que fazer antes que vire problema</p>
      ${bd.risks.map(insight).join("")}
    </div>`;
}

function tabbar(items, activeId) {
  return `<div class="tabbar">${items.map(b => {
    const cls = b.id === activeId ? "active" : "";
    return `<button class="${cls}" data-id="${b.id}">${esc(b.name.split(" ")[0])}</button>`;
  }).join("")}</div>`;
}

function render() {
  const app = document.getElementById("app");
  const cur = currentTeam.find(b => b.id === currentTab);
  const prev = previousTeam.find(b => b.id === prevTab);

  const curContent = cur && cur.profile ? profileCard(cur) : pendingCard(cur);
  const prevContent = prev && prev.profile ? profileCard(prev) : pendingCard(prev);

  app.innerHTML = `
    <div class="header">
      <div class="header-top">
        <div class="logo">K</div>
        <span class="kicker">Keeta Delivery · SMBX Santos · Análise de Perfis</span>
      </div>
      <h1 class="title">Guia de Gestão Individual</h1>
      <p class="subtitle">Como liderar cada BD no ciclo comercial — baseado em MBTI + DISC + Big Five</p>
    </div>

    <div class="tab-group-label">Time atual · julho 2026 em diante</div>
    ${tabbar(currentTeam, currentTab)}

    ${curContent}

    <details class="history">
      <summary>Equipe anterior (até junho 2026) — Victor, Rafael, Milena, Lucas, Douglas</summary>
      <div class="hist-inner">
        ${tabbar(previousTeam, prevTab)}
        ${prevContent}
      </div>
    </details>

    <div class="footer">
      <span>Keeta Delivery · SMBX Santos · Gestão Comercial</span>
      <span>Atualizado em agosto 2026</span>
    </div>`;

  // Wire tab clicks
  app.querySelectorAll(".tabbar button").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-id");
      // Determine which tabbar this button belongs to by checking parent context
      const isCurrent = btn.parentElement === app.querySelectorAll(".tabbar")[0];
      if (isCurrent) { currentTab = id; } else { prevTab = id; }
      render();
    });
  });
}

render();
